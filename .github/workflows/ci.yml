name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "24"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      # No install step: the service has no dependencies, so there is nothing
      # to restore and no lockfile to cache.
      - name: Test
        run: node --test

  image:
    name: Build and scan image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # The Dockerfile's runtime stage copies from its test stage, so this
      # build fails if the tests fail.
      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: featherflag:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: featherflag:ci
          scanners: vuln
          severity: HIGH,CRITICAL
          exit-code: "1"

      - name: Smoke test the container
        run: |
          docker run -d --name ff -p 8080:8080 featherflag:ci

          for i in $(seq 1 20); do
            if curl -fsS localhost:8080/readyz >/dev/null 2>&1; then break; fi
            if [ "$i" -eq 20 ]; then
              echo "::error::container never became ready"
              docker logs ff
              exit 1
            fi
            sleep 1
          done

          curl -fsS localhost:8080/healthz | tee /dev/stderr | grep -q '"status":"ok"'
          curl -fsS "localhost:8080/flags/dark-mode/evaluate?subject=user-1" | grep -q '"enabled":true'
          curl -fsS localhost:8080/metrics | grep -q '^# TYPE http_requests_total counter'

          # A container that ignores SIGTERM gets killed after the timeout and
          # exits non-zero, dropping in-flight requests on every deploy.
          docker stop -t 15 ff
          code=$(docker inspect --format='{{.State.ExitCode}}' ff)
          if [ "$code" != "0" ]; then
            echo "::error::container did not shut down gracefully (exit $code)"
            docker logs ff
            exit 1
          fi

  infra:
    name: Validate Bicep
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Bicep
        run: az bicep build --file infra/main.bicep
