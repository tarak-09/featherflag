name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [dev, staging, prod]
        default: dev

concurrency:
  # Serialise deploys per environment. Two overlapping deploys race to set the
  # active revision and the loser silently wins.
  group: cd-${{ inputs.environment || 'dev' }}
  cancel-in-progress: false

permissions:
  contents: read
  packages: write
  id-token: write # required for Azure OIDC

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build and push
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.meta.outputs.image }}

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image reference
        id: meta
        run: |
          # Tag by commit SHA, never by :latest. A mutable tag makes it
          # impossible to say what is actually running, and breaks rollback.
          image="${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA::12}"
          echo "image=${image,,}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true

  deploy:
    name: Deploy to Container Apps
    needs: build
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment || 'dev' }}

    steps:
      - uses: actions/checkout@v4

      # Federated credentials, so there is no client secret in GitHub to leak
      # or rotate. Configure a federated identity credential on the app
      # registration scoped to this repo and environment.
      - name: Azure login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy
        id: deploy
        uses: azure/arm-deploy@v2
        with:
          scope: resourcegroup
          resourceGroupName: ${{ vars.AZURE_RESOURCE_GROUP }}
          template: infra/main.bicep
          parameters: >-
            environment=${{ inputs.environment || 'dev' }}
            containerImage=${{ needs.build.outputs.image }}
            appRevision=${{ github.sha }}
            ownerEmail=${{ vars.OWNER_EMAIL }}
            costCenter=${{ vars.COST_CENTER }}
            registryUsername=${{ github.actor }}
            registryPassword=${{ secrets.GITHUB_TOKEN }}

      - name: Verify the deployed revision
        run: |
          url="${{ steps.deploy.outputs.url }}"

          # Poll until the new revision is actually serving. A deploy that
          # returns success before traffic shifts reports green while the old
          # revision is still answering.
          for i in $(seq 1 30); do
            revision=$(curl -fsS "$url/healthz" 2>/dev/null | jq -r '.revision // empty' || true)
            if [ "$revision" = "${{ github.sha }}" ]; then
              echo "Revision ${{ github.sha }} is live at $url"
              exit 0
            fi
            sleep 10
          done

          echo "::error::deployed revision never became live at $url (last seen: ${revision:-none})"
          exit 1
